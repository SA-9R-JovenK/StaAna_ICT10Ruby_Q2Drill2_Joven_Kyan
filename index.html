<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream Fortress Map Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container py-4">

    <h1><a href="https://steamcommunity.com/workshop/browse?appid=440" target="_blank" >Create Halloween Maps on the Workshop</a></h1>
    <p>Hop on Team Fortress 2 and face your foes on the Scream Fortress maps, all featured and newly added.<br>
    Merasmus needs more souls for the Japanese Mafia</p>

    <div class="mt-4">
        <input type="text"class="form-control mb-3"id="mapname"placeholder="Enter Halloween Map">
        <button class="btn btn-primary"py-click="add_member">Register Map</button>
    </div>

    <div class="member-box mt-4">
        <h2>Featured Halloween Maps</h2>
        <div id="member_list"></div>
        <h3 id="total_members"></h3>

    </div>

</div>

<py-script src="main.py"></py-script>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

</body>
</html>
